# One config for every Python file in the repo (backend/, tests/, evals/).
line-length = 100
target-version = "py312"
extend-exclude = ["frontend"]

[lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # import order
  "B",             # bugbear
  "UP",            # modern syntax
  "S",             # security (bandit)
  "ASYNC",         # async pitfalls
  "SIM", "C4",     # simplifications
  "N",             # naming
  "PT",            # pytest style
  "T20",           # no print()
  "ERA",           # no commented-out code
  "PL",            # pylint (incl. magic numbers)
  "RUF",
]
# CLAUDE.md names domain exceptions without an "Error" suffix (CaseAlreadyDecided, ...).
ignore = ["N818"]

[lint.per-file-ignores]
# Table-driven tests take one argument per column.
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLR0913", "PLR0917"]
# Verbatim data tables (PDF rows, scenarios, their expectations): one row per line so
# they can be checked against the specs line by line.
"backend/seed/pdf_rows.py" = ["E501"]
"backend/seed/scenarios.py" = ["E501"]
"tests/backend/seed/test_seed_data.py" = ["E501"]
"tests/backend/rules/*.py" = ["E501"]
# UI copy: one sentence per line, so every text Luis sees can be found with grep.
"backend/app/rules/texts.py" = ["E501"]
"backend/app/agents/writer.py" = ["E501"]
"backend/app/agents/questions.py" = ["E501"]
"backend/app/agents/smoke.py" = ["E501"]
"backend/app/agents/templates.py" = ["E501"]
"tests/backend/agents/*.py" = ["E501"]
"tests/backend/fakes.py" = ["E501"]
"tests/backend/api/test_decisions.py" = ["E501"]
"tests/backend/api/test_cases_api.py" = ["E501"]
"tests/backend/api/test_policies_api.py" = ["E501"]
"tests/backend/api/test_prepare_new.py" = ["E501"]
"tests/backend/evals/*.py" = ["E501"]
"tests/backend/seed/test_reset_demo.py" = ["E501"]
"tests/backend/services/*.py" = ["E501"]
# Eval CLIs: the report is their output; case tables read better on one line.
"evals/*.py" = ["T201", "E501"]

[lint.pylint]
# Keyword-only parameters (`*, a, b`) read fine; six keeps signatures explicit.
max-args = 6

[lint.isort]
known-first-party = ["app"]
