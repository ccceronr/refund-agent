# At the repo root so it is found both from backend/ and from tests/ paths.
[pytest]
testpaths = tests/backend
# Shared test helpers (fakes.py) import as top-level modules.
pythonpath = tests/backend
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = --strict-markers --strict-config -ra --import-mode=importlib
