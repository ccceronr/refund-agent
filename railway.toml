# Railway config as code (design §11; docs.railway.com/config-as-code/reference).
# One `app` service built from the root Dockerfile; Postgres is a separate Railway service.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# The image's CMD starts uvicorn on 0.0.0.0:$PORT (what Railway's public networking needs).
preDeployCommand = ["sh bin/pre-deploy.sh"]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
