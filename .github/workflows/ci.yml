# CI (R-37): the pre-commit checks, the tests, dependency audits and the image build.
# Railway deploys main only after this passes ("Wait for CI", design §11).
# Actions are pinned by commit SHA (OWASP A03); Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          # Throwaway database that lives only for this job.
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: refunds
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:ci-postgres@localhost:5432/refunds_test
      APP_RW_PASSWORD: ci-app-rw
      AGENT_RO_PASSWORD: ci-agent-ro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: uv sync --project backend --locked
      - name: ruff
        run: uv run --project backend ruff check backend tests
      - name: ruff format
        run: uv run --project backend ruff format --check backend tests
      - name: mypy (strict)
        working-directory: backend
        run: uv run mypy
      - name: pytest
        run: uv run --project backend pytest
      - name: migrate (the same commands compose and Railway run)
        env:
          APP_ENV: local
          DATABASE_ADMIN_URL: postgresql://postgres:ci-postgres@localhost:5432/refunds
          DATABASE_URL_RW: postgresql+asyncpg://app_rw:ci-app-rw@localhost:5432/refunds
        run: |
          uv run --project backend python -m app.db.bootstrap_roles
          cd backend && uv run alembic upgrade head && uv run python -m seed.seed --if-empty
      - name: pip-audit (reports, does not block)
        continue-on-error: true
        run: uv run --project backend pip-audit --skip-editable --progress-spinner off

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: eslint
        run: npm run lint
      - name: prettier
        run: npm run format:check
      - name: tsc
        run: npm run typecheck
      - name: vitest
        run: npm test
      - name: npm audit (blocks on high and critical only)
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (whole history)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner

  image:
    # A broken Dockerfile fails here, not in the Railway deploy.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docker build
        run: docker build --tag fee-refund-agent:ci .
